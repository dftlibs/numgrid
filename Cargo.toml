[package]
name = "numgrid"
version = "2.2.0"
authors = ["Radovan Bast <version-control@radovan.xyz>"]
description = "Numerical integration grid for molecules."
license = "MPL-2.0"
edition = "2024"
readme = "README.md"
homepage = "https://github.com/dftlibs/numgrid/"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
statrs = "0.19"
rand = "0.10"
rayon = "1.12"
pyo3 = { version = "0.29", features = ["extension-module"] }
# default-features = false because it by defaults includes default-tls which
# seems to pull in libssl and libcrypto which is rejected by manylinux
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
